<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NRO Studio J2ME Emulator Runner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #09090b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #e4e4e7;
    }
    #screen-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      border: 1px solid #27272a;
      box-shadow: 0 4px 24px rgba(0,0,0,0.7);
      width: 240px;
      height: 320px;
      overflow: hidden;
    }
    #display {
      display: none;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      outline: none;
      cursor: crosshair;
    }
    #status-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(9, 9, 11, 0.95);
      z-index: 10;
      text-align: center;
      gap: 10px;
    }
    .stage-badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      font-weight: 700;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
    }
    .stage-badge.error {
      background: #450a0a;
      color: #f87171;
      border-color: #dc2626;
    }
    .stage-badge.running {
      background: #064e3b;
      color: #34d399;
      border-color: #059669;
    }
    .status-msg {
      font-size: 11px;
      line-height: 1.4;
      color: #a1a1aa;
      max-width: 220px;
      word-break: break-word;
    }
    .error-details {
      font-size: 10px;
      color: #fca5a5;
      background: #18181b;
      padding: 6px;
      border-radius: 4px;
      border: 1px solid #7f1d1d;
      max-height: 110px;
      overflow-y: auto;
      text-align: left;
      width: 100%;
      white-space: pre-wrap;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid #27272a;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="screen-area">
    <canvas id="display" tabindex="0" width="240" height="320"></canvas>
    <div id="status-overlay">
      <div id="spinner" class="spinner"></div>
      <div id="stage-badge" class="stage-badge">IDLE</div>
      <div id="status-msg" class="status-msg">Emulator runner ready. Awaiting command.</div>
      <div id="error-details" class="error-details" style="display: none;"></div>
    </div>
  </div>

  <script type="module">
    // --- Error & Exception Capture ---
    function sendLog(level, message) {
      try {
        window.parent.postMessage({
          type: 'LOG',
          entry: {
            id: 'log-' + Date.now() + '-' + Math.random().toString(36).substring(2, 6),
            timestamp: new Date().toLocaleTimeString(),
            level,
            message: String(message)
          }
        }, '*');
      } catch (e) {}
    }

    const origLog = console.log;
    const origWarn = console.warn;
    const origError = console.error;

    console.log = function(...args) {
      origLog.apply(console, args);
      sendLog('info', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    };
    console.warn = function(...args) {
      origWarn.apply(console, args);
      sendLog('warn', args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(' '));
    };
    console.error = function(...args) {
      origError.apply(console, args);
      sendLog('error', args.map(a => typeof a === 'object' ? (a.stack || JSON.stringify(a)) : String(a)).join(' '));
    };

    window.onerror = function(message, source, lineno, colno, error) {
      const errStr = error && error.stack ? error.stack : `${message} at ${source}:${lineno}:${colno}`;
      sendLog('error', `[window.onerror] ${errStr}`);
      handleFatalError('Uncaught window error', errStr);
      return false;
    };

    window.addEventListener('unhandledrejection', function(e) {
      const reason = e.reason && e.reason.stack ? e.reason.stack : String(e.reason);
      sendLog('error', `[unhandledrejection] ${reason}`);
      handleFatalError('Unhandled promise rejection', reason);
    });

    // --- State Machine & UI Controls ---
    let currentStage = 'IDLE';
    let stageTimeoutTimer = null;
    const STAGE_TIMEOUT_MS = 15000; // 15 seconds strict timeout per stage

    const badgeEl = document.getElementById('stage-badge');
    const msgEl = document.getElementById('status-msg');
    const spinnerEl = document.getElementById('spinner');
    const errorDetailsEl = document.getElementById('error-details');
    const overlayEl = document.getElementById('status-overlay');
    const displayCanvas = document.getElementById('display');
    const screenCtx = displayCanvas.getContext('2d');

    // Runtime state tracking
    const runtimeState = {
      cheerpjLoaded: false,
      freej2meLoaded: false,
      runtimeScriptLoaded: false,
      runtimeInitialized: false,
      gameJarMounted: false,
      midletStarted: false,
      canvasConnected: false,
      cheerpjLib: null,
      freej2meClass: null,
      launcherUtil: null,
    };

    function setStage(stage, message, errorDetail = null) {
      clearTimeout(stageTimeoutTimer);
      currentStage = stage;

      badgeEl.textContent = stage;
      badgeEl.className = 'stage-badge' + (stage === 'ERROR' ? ' error' : stage === 'RUNNING' ? ' running' : '');
      msgEl.textContent = message;

      if (errorDetail) {
        errorDetailsEl.style.display = 'block';
        errorDetailsEl.textContent = errorDetail;
      } else {
        errorDetailsEl.style.display = 'none';
      }

      if (stage === 'RUNNING') {
        spinnerEl.style.display = 'none';
        overlayEl.style.display = 'none';
        displayCanvas.style.display = 'block';
        displayCanvas.focus();
      } else {
        overlayEl.style.display = 'flex';
        spinnerEl.style.display = (stage === 'ERROR' || stage === 'IDLE') ? 'none' : 'block';
      }

      // Send status to parent
      window.parent.postMessage({
        type: 'STATUS_CHANGE',
        status: stage,
        stage: stage,
        message,
        error: errorDetail,
        runtimeInfo: {
          cheerpjLoaded: runtimeState.cheerpjLoaded,
          freej2meLoaded: runtimeState.freej2meLoaded,
          runtimeScriptLoaded: runtimeState.runtimeScriptLoaded,
          runtimeInitialized: runtimeState.runtimeInitialized,
          gameJarMounted: runtimeState.gameJarMounted,
          midletStarted: runtimeState.midletStarted,
          canvasConnected: runtimeState.canvasConnected,
        }
      }, '*');

      // 15-second Stage Watchdog
      if (stage !== 'IDLE' && stage !== 'RUNNING' && stage !== 'ERROR' && stage !== 'STOPPED') {
        stageTimeoutTimer = setTimeout(() => {
          handleTimeout(stage);
        }, STAGE_TIMEOUT_MS);
      }
    }

    function handleTimeout(stage) {
      const err = `Runtime initialization timed out after 15s at stage: ${stage}`;
      console.error(err);
      setStage('ERROR', `Timed out at stage [${stage}]`, err);
    }

    function handleFatalError(title, details) {
      clearTimeout(stageTimeoutTimer);
      setStage('ERROR', title, details);
    }

    // --- Dynamic CheerpJ Script Loader ---
    async function loadCheerpJScript() {
      if (window.cheerpjInit) {
        runtimeState.runtimeScriptLoaded = true;
        runtimeState.cheerpjLoaded = true;
        return true;
      }

      console.log('[1] Loading CheerpJ runtime script from CDN...');
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cjrtnc.leaningtech.com/20260317_2978/loader.js';
        script.crossOrigin = 'anonymous';

        script.onload = () => {
          console.log('[2] CheerpJ script loaded successfully');
          runtimeState.runtimeScriptLoaded = true;
          runtimeState.cheerpjLoaded = typeof window.cheerpjInit === 'function';
          resolve(true);
        };

        script.onerror = (e) => {
          const err = 'Failed to load CheerpJ loader.js from CDN (blocked by network, CSP, or CORS)';
          console.error('[2] ' + err, e);
          runtimeState.runtimeScriptLoaded = false;
          runtimeState.cheerpjLoaded = false;
          reject(new Error(err));
        };

        document.head.appendChild(script);
      });
    }

    // --- Initialize CheerpJ & FreeJ2ME Runtime ---
    async function initializeCheerpJRuntime() {
      if (runtimeState.freej2meLoaded && runtimeState.freej2meClass) {
        return;
      }

      setStage('LOADING_RUNTIME', 'Loading CheerpJ runtime script...');
      await loadCheerpJScript();

      setStage('LOADING_RUNTIME', 'Initializing CheerpJ runtime & native bridges...');
      console.log('[3] Initializing CheerpJ runtime...');

      // Dynamic import of FreeJ2ME native JS modules
      const [
        canvasFontModule,
        canvasGraphicsModule,
        gles2Module,
        jsReferenceModule,
        mediaBridgeModule,
        midiBridgeModule,
      ] = await Promise.all([
        import('/emulator/core/libjs/libcanvasfont.js').catch(e => { console.warn('Font bridge load error', e); return { default: {} }; }),
        import('/emulator/core/libjs/libcanvasgraphics.js').catch(e => { console.warn('Graphics bridge load error', e); return { default: {} }; }),
        import('/emulator/core/libjs/libgles2.js').catch(e => { console.warn('Gles2 bridge load error', e); return { default: {} }; }),
        import('/emulator/core/libjs/libjsreference.js').catch(e => { console.warn('JS ref bridge load error', e); return { default: {} }; }),
        import('/emulator/core/libjs/libmediabridge.js').catch(e => { console.warn('Media bridge load error', e); return { default: {} }; }),
        import('/emulator/core/libjs/libmidibridge.js').catch(e => { console.warn('Midi bridge load error', e); return { default: {} }; }),
      ]);

      const canvasFontNatives = canvasFontModule.default || canvasFontModule;
      const canvasGraphicsNatives = canvasGraphicsModule.default || canvasGraphicsModule;
      const gles2Natives = gles2Module.default || gles2Module;
      const jsReferenceNatives = jsReferenceModule.default || jsReferenceModule;
      const mediaBridgeNatives = mediaBridgeModule.default || mediaBridgeModule;
      const midiBridgeNatives = midiBridgeModule.default || midiBridgeModule;

      try {
        await window.cheerpjInit({
          enableDebug: false,
          natives: {
            ...canvasFontNatives,
            ...canvasGraphicsNatives,
            ...gles2Natives,
            ...jsReferenceNatives,
            ...mediaBridgeNatives,
            ...midiBridgeNatives,
            async Java_pl_zb3_freej2me_bridge_shell_Shell_setTitle(lib, title) {
              console.log('[Shell] App Title:', title);
            },
            async Java_pl_zb3_freej2me_bridge_shell_Shell_getScreenCtx(lib) {
              runtimeState.canvasConnected = true;
              return screenCtx;
            },
            async Java_pl_zb3_freej2me_bridge_shell_Shell_setCanvasSize(lib, width, height) {
              console.log(`[Shell] setCanvasSize: ${width}x${height}`);
              displayCanvas.width = width;
              displayCanvas.height = height;
              displayCanvas.style.width = width + 'px';
              displayCanvas.style.height = height + 'px';
              runtimeState.canvasConnected = true;
              // True runtime frame ready!
              setStage('RUNNING', `Game running (${width}x${height})`);
            },
            async Java_pl_zb3_freej2me_bridge_shell_Shell_say(lib, msg) {
              console.log('[FreeJ2ME]', msg);
            }
          }
        });
        runtimeState.runtimeInitialized = true;
        console.log('[4] CheerpJ ready');
      } catch (err) {
        console.error('[4] CheerpJ initialization error:', err);
        throw new Error('CheerpJ initialization failed: ' + (err.message || err));
      }

      setStage('LOADING_RUNTIME', 'Mounting FreeJ2ME core library (freej2me-web.jar)...');
      console.log('[5] Loading FreeJ2ME runtime from /emulator/core/freej2me-web.jar...');

      try {
        const lib = await window.cheerpjRunLibrary('/emulator/core/freej2me-web.jar');
        runtimeState.cheerpjLib = lib;

        const FreeJ2ME = await lib.org.recompile.freej2me.FreeJ2ME;
        runtimeState.freej2meClass = FreeJ2ME;

        const launcherUtil = await lib.pl.zb3.freej2me.launcher.LauncherUtil;
        runtimeState.launcherUtil = launcherUtil;

        runtimeState.freej2meLoaded = true;
        console.log('[6] FreeJ2ME ready');
        setStage('RUNTIME_READY', 'FreeJ2ME runtime ready');
      } catch (err) {
        console.error('[6] FreeJ2ME runtime loading error:', err);
        throw new Error('FreeJ2ME JAR runtime loading failed: ' + (err.message || err));
      }
    }

    // --- Mount Game JAR into CheerpJ Virtual FS ---
    async function mountGameJar(arrayBuffer, fileName) {
      setStage('MOUNTING_JAR', `Mounting ${fileName} into virtual filesystem...`);
      console.log(`[7] Mounting JAR: ${fileName} (${arrayBuffer.byteLength} bytes)...`);

      if (!runtimeState.cheerpjLib || !runtimeState.launcherUtil) {
        throw new Error('Cannot mount JAR: FreeJ2ME launcherUtil not available');
      }

      const File = await runtimeState.cheerpjLib.java.io.File;
      const tmpPath = '/files/_tmp/game_' + Date.now() + '.jar';
      const jarFile = await new File(tmpPath);

      // Copy buffer into CheerpJ virtual file
      const int8Data = new Int8Array(arrayBuffer);
      await runtimeState.launcherUtil.copyJar(int8Data, jarFile);

      runtimeState.gameJarMounted = true;
      console.log(`[7] JAR successfully mounted at virtual path: ${tmpPath}`);
      setStage('JAR_MOUNTED', `JAR mounted at ${tmpPath}`);

      return tmpPath;
    }

    // --- Start MIDlet ---
    async function startMidlet(jarVirtualPath, mainClass) {
      setStage('STARTING_MIDLET', `Starting MIDlet: ${mainClass}...`);
      console.log(`[8] Starting MIDlet target: ${mainClass} from ${jarVirtualPath}...`);

      if (!runtimeState.freej2meClass) {
        throw new Error('FreeJ2ME class not available');
      }

      runtimeState.midletStarted = true;

      // Invoke FreeJ2ME.main(['jar', jarVirtualPath])
      runtimeState.freej2meClass.main(['jar', jarVirtualPath]).catch(err => {
        console.error('[FreeJ2ME crash]', err);
        handleFatalError('MIDlet crashed during execution', err && err.stack ? err.stack : String(err));
      });

      console.log('[9] Awaiting canvas resize & initial frame from FreeJ2ME runtime...');
    }

    // --- Self-Test Runner ---
    async function runSelfTest() {
      console.log('=== [SELF-TEST] Starting automated emulator diagnostics ===');
      setStage('LOADING_RUNTIME', 'Self-Test: Testing CheerpJ & FreeJ2ME integration...');

      try {
        await initializeCheerpJRuntime();

        if (runtimeState.cheerpjLoaded && runtimeState.freej2meLoaded) {
          console.log('=== [SELF-TEST] PASS: CheerpJ and FreeJ2ME loaded and initialized ===');
          setStage('RUNTIME_READY', 'EMULATOR SELF-TEST: PASS (Core ready)');
          window.parent.postMessage({
            type: 'SELF_TEST_RESULT',
            status: 'PASS',
            stage: currentStage,
            runtimeInfo: {
              cheerpjLoaded: runtimeState.cheerpjLoaded,
              freej2meLoaded: runtimeState.freej2meLoaded,
              runtimeScriptLoaded: runtimeState.runtimeScriptLoaded,
              runtimeInitialized: runtimeState.runtimeInitialized,
              gameJarMounted: false,
              midletStarted: false,
              canvasConnected: false,
            }
          }, '*');
        } else {
          throw new Error('Core state verification failed after initialization');
        }
      } catch (err) {
        console.error('=== [SELF-TEST] FAIL ===', err);
        const rootCause = err && err.message ? err.message : String(err);
        setStage('ERROR', 'EMULATOR SELF-TEST: FAIL', rootCause);
        window.parent.postMessage({
          type: 'SELF_TEST_RESULT',
          status: 'FAIL',
          stage: currentStage,
          rootCause,
          runtimeInfo: {
            cheerpjLoaded: runtimeState.cheerpjLoaded,
            freej2meLoaded: runtimeState.freej2meLoaded,
            runtimeScriptLoaded: runtimeState.runtimeScriptLoaded,
            runtimeInitialized: runtimeState.runtimeInitialized,
          }
        }, '*');
      }
    }

    // --- Parent Message Handler ---
    window.addEventListener('message', async (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;

      if (data.type === 'PING') {
        window.parent.postMessage({
          type: 'PONG',
          stage: currentStage,
          runtimeInfo: {
            cheerpjLoaded: runtimeState.cheerpjLoaded,
            freej2meLoaded: runtimeState.freej2meLoaded,
            runtimeScriptLoaded: runtimeState.runtimeScriptLoaded,
            runtimeInitialized: runtimeState.runtimeInitialized,
          }
        }, '*');
        return;
      }

      if (data.type === 'RUN_SELF_TEST') {
        await runSelfTest();
        return;
      }

      if (data.type === 'LOAD_JAR') {
        try {
          const { jarBuffer, fileName, mainClass } = data;
          if (!jarBuffer) {
            throw new Error('No JAR buffer provided in LOAD_JAR event');
          }

          console.log(`[HANDOFF] Received JAR buffer from parent: ${fileName} (${jarBuffer.byteLength} bytes)`);

          // 1. Ensure runtime ready
          await initializeCheerpJRuntime();

          // 2. Mount JAR
          const jarVirtualPath = await mountGameJar(jarBuffer, fileName);

          // 3. Start MIDlet
          await startMidlet(jarVirtualPath, mainClass || 'main.GameMidlet');

        } catch (err) {
          console.error('[LOAD_JAR exception]', err);
          const errorMsg = err instanceof Error ? err.message : String(err);
          const stack = err instanceof Error ? err.stack : '';
          handleFatalError('Failed to load/start JAR', stack || errorMsg);
        }
        return;
      }

      if (data.type === 'STOP') {
        clearTimeout(stageTimeoutTimer);
        setStage('STOPPED', 'Execution stopped by user');
        return;
      }
    });

    // Notify parent that iframe is active
    window.parent.postMessage({
      type: 'IFRAME_READY',
      origin: window.location.origin
    }, '*');
  </script>
</body>
</html>
